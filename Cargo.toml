[package]
name = "tokenusage"
version = "1.1.3"
edition = "2024"
description = "Fast Rust CLI/TUI/GUI for Claude Code and Codex token usage, cost tracking, and live session monitoring."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/tokenusage"
repository = "https://github.com/hanbu97/tokenusage"
homepage = "https://github.com/hanbu97/tokenusage"
keywords = ["claude", "codex", "token-usage", "usage-tracker", "tui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.87"

[package.metadata.binstall.overrides."x86_64-unknown-linux-gnu"]
pkg-url = "{ repo }/releases/download/v{ version }/tu-v{ version }-{ target }.tar.gz"
bin-dir = "tu-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides."x86_64-apple-darwin"]
pkg-url = "{ repo }/releases/download/v{ version }/tu-v{ version }-{ target }.tar.gz"
bin-dir = "tu-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides."aarch64-apple-darwin"]
pkg-url = "{ repo }/releases/download/v{ version }/tu-v{ version }-{ target }.tar.gz"
bin-dir = "tu-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides."x86_64-pc-windows-msvc"]
pkg-url = "{ repo }/releases/download/v{ version }/tu-v{ version }-{ target }.zip"
bin-dir = "tu-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
crossterm = "0.29"
crossbeam-channel = "0.5"
dirs = "6.0"
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "tokio", "canvas"] }
ignore = "0.4"
ratatui = "0.29"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread"] }
terminal_size = "0.4"
