[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenusage"
dynamic = ["version"]
description = "Fast Rust CLI/TUI/GUI token usage tracker for Codex, Claude Code, and Antigravity usage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "hanbu97", email = "hanbu97@gmail.com" }]
keywords = [
    "codex-usage",
    "claude-code-usage",
    "token-usage-tracker",
    "antigravity",
    "ai-coding-cost",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hanbu97/tokenusage"
Repository = "https://github.com/hanbu97/tokenusage"
Issues = "https://github.com/hanbu97/tokenusage/issues"

[project.scripts]
tu = "tokenusage._cli:main"

[tool.hatch.version]
path = "tokenusage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tokenusage"]
